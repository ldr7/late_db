[package]
name = "late_db"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[lib]
name = "late_db"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "scoring_smoke"
harness = false
